<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Egress lock that travels with the HTML on ANY host (not just Cloudflare):
      the page can only fetch from itself and Google's Gemini endpoint, so a BYO
      key cannot be sent anywhere else. frame-ancestors can't be set via <meta>,
      so it lives in public/_headers (applied by Cloudflare).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://generativelanguage.googleapis.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <!-- SERP title carries the search phrase; the h1 and og:title carry the brand.
         Google may pick either, so they must agree, not compete. -->
    <title>PDF to Markdown Converter · Client-Side Gemini OCR</title>
    <meta
      name="description"
      content="Convert PDFs to Markdown with super-parallel Gemini OCR from your browser. Bring your own Gemini API key. There is no backend: pages go straight to Google."
    />
    <link rel="canonical" href="https://pdfsplitparse.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />

    <!-- Rich link previews. og:image must be an absolute URL for most scrapers. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="pdfsplitparse.com" />
    <meta property="og:title" content="PDF → Split → Markdown" />
    <meta
      property="og:description"
      content="Split a PDF and OCR every page in parallel, straight from your browser to Gemini. This site has no backend, so your key and documents never reach us."
    />
    <meta property="og:url" content="https://pdfsplitparse.com/" />
    <meta property="og:image" content="https://pdfsplitparse.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="PDF → Split → Markdown — super-parallel client-side Gemini OCR" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PDF → Split → Markdown" />
    <meta
      name="twitter:description"
      content="Split a PDF and OCR every page in parallel, straight from your browser to Gemini. This site has no backend, so your key and documents never reach us."
    />
    <meta name="twitter:image" content="https://pdfsplitparse.com/og.png" />

    <!-- Inert data block (never executed), so the script-src CSP doesn't apply. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PDF → Split → Markdown",
        "url": "https://pdfsplitparse.com/",
        "description": "Convert PDFs to Markdown with super-parallel Gemini OCR from your browser. Bring your own Gemini API key. There is no backend: pages go straight to Google.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and a Google Gemini API key",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Rareș Gosman", "url": "https://rares.blog" }
      }
    </script>
    <!-- Sets the theme class on <html> before first paint (no flash). Relative
         path because Vite builds with base: './'. Blocking by design. -->
    <script src="./theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
