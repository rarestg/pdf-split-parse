<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Social share card (1200×630). Mirrors the app: gold sunburst rays behind a
     white panel on the page background, title with accent arrows, muted subline.
     Text set in Nimbus Sans (a Helvetica clone, matching the app's system stack);
     rasterized by scripts/og-assets.ts (npm run assets:og). -->
  <rect width="1200" height="630" fill="#f6f7f9" />

  <!-- 12 sunburst ray wedges from the canvas center (behind the panel). -->
  <g transform="translate(600 315)" fill="#ffb066" opacity="0.16">
    <g id="ray"><path d="M0 0 L-48 -1000 L48 -1000 Z" /></g>
    <use href="#ray" transform="rotate(30)" />
    <use href="#ray" transform="rotate(60)" />
    <use href="#ray" transform="rotate(90)" />
    <use href="#ray" transform="rotate(120)" />
    <use href="#ray" transform="rotate(150)" />
    <use href="#ray" transform="rotate(180)" />
    <use href="#ray" transform="rotate(210)" />
    <use href="#ray" transform="rotate(240)" />
    <use href="#ray" transform="rotate(270)" />
    <use href="#ray" transform="rotate(300)" />
    <use href="#ray" transform="rotate(330)" />
  </g>

  <!-- App-style panel. -->
  <rect x="80" y="150" width="1040" height="330" rx="24" fill="#ffffff" stroke="#cdd5df" stroke-width="2" />

  <text x="600" y="305" text-anchor="middle" font-family="Nimbus Sans" font-weight="bold" font-size="72" fill="#1a1f29">PDF <tspan fill="#2563eb">→</tspan> Split <tspan fill="#2563eb">→</tspan> Markdown</text>
  <text x="600" y="400" text-anchor="middle" font-family="Nimbus Sans" font-size="31" fill="#5c6675">Super-parallel client-side Gemini OCR · your key, no server</text>

  <text x="600" y="565" text-anchor="middle" font-family="Nimbus Sans" font-weight="bold" font-size="27" fill="#2563eb">pdfsplitparse.com</text>
</svg>
